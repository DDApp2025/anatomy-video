name: render

on:
  push:
    branches: [main]
    paths: ['job.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 -c "import json;print(json.dumps(json.load(open('job.json'))['chunks']))")" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1 ffmpeg > /dev/null
          pip install -q bpy==5.3.0 numpy
      - name: Render
        env:
          SCENE_KEY: ${{ secrets.SCENE_KEY_V2 }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in scene2.enc -out /tmp/s.py -pass env:SCENE_KEY
          export SAMPLES=$(python3 -c "import json;print(json.load(open('job.json'))['samples'])")
          export RES=$(python3 -c "import json;print(json.load(open('job.json'))['res'])")
          export RW=$(python3 -c "import json;print(json.load(open('job.json')).get('rw',1920))")
          export RH=$(python3 -c "import json;print(json.load(open('job.json')).get('rh',1080))")
          export OUT=frames
          nproc
          start=$(date +%s)
          python3 /tmp/s.py -- ${{ matrix.chunk.frames }} > /tmp/log.txt 2>&1 || true
          grep -E "FRAME_DONE" /tmp/log.txt | cut -c1-80 || true
          end=$(date +%s)
          rm -f /tmp/s.py
          mkdir -p result frames
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/log.txt -out result/log_${{ matrix.chunk.id }}.enc -pass env:SCENE_KEY
          count=$(ls frames | wc -l)
          echo "chunk ${{ matrix.chunk.id }} frames $count seconds $((end-start))" > result/time_${{ matrix.chunk.id }}.txt
          cat result/time_${{ matrix.chunk.id }}.txt
          if [ "$(python3 -c "import json;print(json.load(open('job.json'))['mode'])")" = "video" ]; then
            first=$(ls frames | head -1 | sed 's/f_0*\([0-9]*\)\.png/\1/')
            ffmpeg -loglevel error -framerate 24 -start_number ${first:-0} -i frames/f_%05d.png -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p result/part_${{ matrix.chunk.id }}.mp4 || true
          else
            cp frames/*.png result/ || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk.id }}
          path: result/

  collect:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - name: Publish results
        run: |
          mkdir /tmp/out && cp -r parts/* /tmp/out/ || true
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf . > /dev/null
          cp -r /tmp/out/* . || true
          git add -A
          git commit -m "render results" > /dev/null
          git push -f origin output
